<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>TranoGasy</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI',
          Roboto, sans-serif;
        background: #09090b;
        color: #fafafa;
        text-align: center;
      }
      .card {
        max-width: 340px;
        width: 100%;
        padding: 28px 24px;
        border-radius: 28px;
        background: #18181b;
        border: 1px solid #27272a;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }
      .badge {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: rgba(124, 189, 30, 0.14);
        color: #7cbd1e;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 22px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        font-weight: 800;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        line-height: 1.5;
        color: #a1a1aa;
        margin: 0 0 20px;
      }
      button {
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 999px;
        background: #7cbd1e;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">TG</div>
      <h1>TranoGasy</h1>
      <p id="status">
        Connexion à TranoGasy en cours… Vérifiez votre connexion Internet si le
        chargement prend plus de quelques secondes.
      </p>
      <button type="button" onclick="retryConnect()">Réessayer</button>
    </div>
    <script>
      function resolvePlatformUrl() {
        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        return isAndroid
          ? 'https://tranogasy2.vercel.app'
          : 'https://tranogasy-ios.vercel.app';
      }
      function retryConnect() {
        window.location.replace(resolvePlatformUrl());
      }
      window.addEventListener('online', retryConnect);
      setTimeout(retryConnect, 1200);
    </script>
  </body>
</html>
