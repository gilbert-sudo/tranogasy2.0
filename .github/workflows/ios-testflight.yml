name: Build & Deploy iOS to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/ios/**'
      - 'frontend/scripts/build-mobile.mjs'
      - 'frontend/capacitor.config.ts'
      - '.github/workflows/ios-testflight.yml'

jobs:
  ios-testflight:
    name: Archive, Sign & Upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies, build local iOS bundle & sync Capacitor
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://tranogasy2-api.onrender.com/api
          NEXT_PUBLIC_IMAGE_API_ORIGIN: https://tranogasy-ios.vercel.app
        run: |
          npm ci
          npm run build:mobile:ios
          npm run cap:sync:ios

      - name: Install Apple Certificate & Provisioning Profile
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_TEMP="$RUNNER_TEMP/build.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo -n "$APPLE_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_TEMP"

          # Create and configure temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import Apple WWDR G3 intermediate certificate to guarantee chain trust
          curl -sSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security || true

          # Import PKCS#12 certificate (with automatic OpenSSL 3 legacy fallback if needed by macOS security CLI)
          if ! security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"; then
            echo "Re-encoding PKCS#12 with legacy 3DES/SHA1 MAC for macOS Keychain compatibility..."
            OPENSSL_BIN="/opt/homebrew/opt/openssl@3/bin/openssl"
            if [ ! -x "$OPENSSL_BIN" ]; then
              OPENSSL_BIN="openssl"
            fi
            "$OPENSSL_BIN" pkcs12 -in "$CERT_PATH" -passin "pass:$APPLE_CERT_PASSWORD" -nodes -out "$RUNNER_TEMP/extracted.pem"
            "$OPENSSL_BIN" pkcs12 -export -legacy -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1 \
              -in "$RUNNER_TEMP/extracted.pem" \
              -out "$CERT_PATH" \
              -passout "pass:$APPLE_CERT_PASSWORD"
            rm -f "$RUNNER_TEMP/extracted.pem"
            security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Extract exact UUID, Profile Name, and Team ID directly from the signed provisioning profile
          security cms -D -i "$PROFILE_TEMP" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$PROFILE_PLIST")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_TEMP" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "Installed Provisioning Profile: $PROFILE_NAME ($PROFILE_UUID) for Team $TEAM_ID"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Archive & Export Signed IPA
        run: |
          set -euo pipefail

          BUILD_NUMBER=$((100 + ${{ github.run_number }}))
          ARCHIVE_PATH="$RUNNER_TEMP/TranoGasy.xcarchive"
          EXPORT_DIR="$RUNNER_TEMP/export"
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"

          echo "Archiving TranoGasy iOS (Version 1.0, Build $BUILD_NUMBER)..."

          xcodebuild \
            -project frontend/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER="mg.tranogasy.app" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="1.0"

          cat > "$EXPORT_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>mg.tranogasy.app</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath "$EXPORT_DIR"

          IPA_FILE=$(ls "$EXPORT_DIR"/*.ipa | head -n 1)
          echo "IPA_FILE=$IPA_FILE" >> "$GITHUB_ENV"
          echo "Successfully exported signed IPA: $IPA_FILE"

      - name: Upload IPA Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: TranoGasy-iOS-IPA
          path: ${{ env.IPA_FILE }}
          retention-days: 14

      - name: Upload to App Store Connect (TestFlight)
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo -n "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 --decode -o "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          echo "Uploading $IPA_FILE to TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up temporary keychain & private keys
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf "$HOME/.appstoreconnect/private_keys" || true
