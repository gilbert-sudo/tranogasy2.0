<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TranoGasy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: #f5f5f7;
      color: #18181b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
    }
    .badge {
      display: inline-block;
      background: rgba(124, 189, 30, 0.14);
      color: #5d9412;
      font-weight: 700;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      color: #71717a;
      line-height: 1.5;
      margin: 0 0 22px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 14px 20px;
      background: #7cbd1e;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">TranoGasy</div>
    <h1>Connexion Internet requise</h1>
    <p>Vérifiez votre connexion Wi-Fi ou données mobiles puis réessayez pour charger les annonces TranoGasy.</p>
    <button onclick="window.location.href='https://tranogasy-ios.vercel.app'">Réessayer</button>
  </div>
</body>
</html>
